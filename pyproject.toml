[project]
name = "zari"
version = "0.1.0"
description = "Shaxsiy AI Yordamchi — Jarvis-like Assistant"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.14",
    "asyncpg>=0.30",
    "beautifulsoup4>=4.12",
    "duckduckgo_search>=7.0",
    "edge-tts>=6.0",
    "faster-whisper>=1.0",
    "groq>=0.11.0",
    "httpx>=0.27",
    "mss>=9.0",
    "numpy>=1.26",
    "ollama>=0.4",
    "openwakeword>=0.5.0",
    "Pillow>=10.0",
    "piper-tts>=1.2.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pyperclip>=1.8",
    "python-dotenv>=1.0",
    "redis>=5.0",
    "sounddevice>=0.5",
    "soundfile>=0.12",
    "webrtcvad>=2.0",
    "wikipedia>=0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
