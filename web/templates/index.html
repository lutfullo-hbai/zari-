<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zari AI</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a0a;
            color: #e0e0e0;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        header {
            background: #111;
            border-bottom: 1px solid #222;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        header h1 { font-size: 18px; font-weight: 600; }
        #status {
            font-size: 12px;
            padding: 3px 10px;
            border-radius: 12px;
            background: #1a1a2e;
            color: #64ffda;
        }
        #status.offline { color: #ff5252; }
        #chat {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .msg {
            max-width: 75%;
            padding: 10px 16px;
            border-radius: 12px;
            line-height: 1.5;
            font-size: 14px;
            white-space: pre-wrap;
        }
        .msg.user {
            align-self: flex-end;
            background: #1a237e;
            border-bottom-right-radius: 4px;
        }
        .msg.zari {
            align-self: flex-start;
            background: #1e1e1e;
            border: 1px solid #333;
            border-bottom-left-radius: 4px;
        }
        .msg.error {
            align-self: flex-start;
            background: #3e0000;
            border: 1px solid #660000;
            color: #ff8a80;
        }
        #input-bar {
            background: #111;
            border-top: 1px solid #222;
            padding: 12px 20px;
            display: flex;
            gap: 10px;
        }
        #input-bar input {
            flex: 1;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 10px 14px;
            color: #e0e0e0;
            font-size: 14px;
            outline: none;
        }
        #input-bar input:focus { border-color: #64ffda; }
        #input-bar button {
            background: #1a237e;
            border: none;
            border-radius: 8px;
            padding: 10px 20px;
            color: #fff;
            font-size: 14px;
            cursor: pointer;
        }
        #input-bar button:hover { background: #283593; }
        #input-bar button:disabled { background: #333; cursor: not-allowed; }
        .typing {
            align-self: flex-start;
            color: #666;
            font-size: 13px;
            font-style: italic;
        }
    </style>
</head>
<body>
    <header>
        <h1>Zari AI</h1>
        <span id="status" class="offline">offline</span>
    </header>
    <div id="chat"></div>
    <div id="input-bar">
        <input type="text" id="msg" placeholder="Xabar yozing..." autocomplete="off" />
        <button id="send" onclick="send()">Yuborish</button>
    </div>

    <script>
        const chat = document.getElementById('chat');
        const msgInput = document.getElementById('msg');
        const sendBtn = document.getElementById('send');
        const statusEl = document.getElementById('status');
        let ws = null;
        let typingEl = null;

        function addMsg(text, cls) {
            const div = document.createElement('div');
            div.className = 'msg ' + cls;
            div.textContent = text;
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
            return div;
        }

        function showTyping() {
            typingEl = document.createElement('div');
            typingEl.className = 'typing';
            typingEl.textContent = 'Zari javob yozmoqda...';
            chat.appendChild(typingEl);
            chat.scrollTop = chat.scrollHeight;
        }

        function hideTyping() {
            if (typingEl) { typingEl.remove(); typingEl = null; }
        }

        function connect() {
            const proto = location.protocol === 'https:' ? 'wss' : 'ws';
            ws = new WebSocket(`${proto}://${location.host}/ws`);

            ws.onopen = () => {
                statusEl.textContent = 'online';
                statusEl.className = '';
            };

            ws.onmessage = (e) => {
                hideTyping();
                addMsg(e.data, 'zari');
                sendBtn.disabled = false;
            };

            ws.onclose = () => {
                statusEl.textContent = 'offline';
                statusEl.className = 'offline';
                setTimeout(connect, 3000);
            };

            ws.onerror = () => ws.close();
        }

        function send() {
            const text = msgInput.value.trim();
            if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;
            addMsg(text, 'user');
            ws.send(text);
            msgInput.value = '';
            sendBtn.disabled = true;
            showTyping();
        }

        msgInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !sendBtn.disabled) send();
        });

        connect();
    </script>
</body>
</html>
