services:
  zari:
    build: .
    container_name: zari
    env_file:
      - .env.docker
    environment:
      - PULSE_SERVER=unix:/run/user/1000/pulse/native
    volumes:
      - ./data:/app/data
      - ~/.cache/huggingface:/root/.cache/huggingface
      - /run/user/1000/pulse:/run/user/1000/pulse
    devices:
      - /dev/snd:/dev/snd
    group_add:
      - audio
    stdin_open: true
    tty: true
    depends_on:
      redis:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"

  redis:
    image: redis:7-alpine
    container_name: zari-redis
    ports:
      - "6380:6379"
    volumes:
      - redisdata:/data

volumes:
  redisdata:
