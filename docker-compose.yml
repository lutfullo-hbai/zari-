services:
  db:
    image: postgres:15
    container_name: zari-db
    environment:
      POSTGRES_USER: zari
      POSTGRES_PASSWORD: zari
      POSTGRES_DB: zari
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zari"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: zari-redis
    ports:
      - "6380:6379"
    volumes:
      - redisdata:/data

  zari:
    build: .
    container_name: zari-app
    ports:
      - "8080:8080"
    env_file:
      - .env.docker
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  perplexica:
    image: itzcrazykns1337/vane:latest
    container_name: zari-perplexica
    ports:
      - "3001:3001"
    environment:
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - PORT=3001
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  n8n:
    image: n8nio/n8n
    container_name: zari-n8n
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    environment:
      - N8N_SECURE_COOKIE=false
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5678/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  n8n-templates:
    build:
      context: .
      dockerfile: Dockerfile.templates
    container_name: zari-n8n-templates
    ports:
      - "8000:8000"
    volumes:
      - ./n8n_templates:/app/n8n_templates
    environment:
      - WORKFLOW_DB_PATH=/app/n8n_templates/database/workflows.db
      - WORKFLOWS_DIR=/app/n8n_templates/workflows
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  n8n_data:
