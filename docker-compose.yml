services:
  db:
    image: postgres:15
    container_name: zari-db
    environment:
      POSTGRES_USER: zari
      POSTGRES_PASSWORD: zari
      POSTGRES_DB: zari
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zari"]
      interval: 5s
      timeout: 5s
      retries: 5

  zari:
    build: .
    container_name: zari
    network_mode: host
    env_file:
      - .env.docker
    environment:
      - PULSE_SERVER=unix:/run/user/1000/pulse/native
    volumes:
      - ./data:/app/data
      - ~/.cache/huggingface:/root/.cache/huggingface
      - /run/user/1000/pulse:/run/user/1000/pulse
    devices:
      - /dev/snd:/dev/snd
    group_add:
      - audio
    stdin_open: true
    tty: true
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  redis:
    image: redis:7-alpine
    container_name: zari-redis
    ports:
      - "6380:6379"
    volumes:
      - redisdata:/data

  n8n:
    image: n8nio/n8n
    container_name: zari-n8n
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    environment:
      - N8N_SECURE_COOKIE=false
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5678/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  redisdata:
  n8n_data:
